name: CI Dispatch

on:
  workflow_dispatch:
    inputs:
      ubuntu-latest:
        description: 'Run on ubuntu-latest'
        type: boolean
        default: true
      macos-latest:
        description: 'Run on macos-latest'
        type: boolean
        default: false
      windows-latest:
        description: 'Run on windows-latest'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        run: |
          MATRIX="[]"
          append() {
            local runner="$1"
            if [ "$MATRIX" = "[]" ]; then
              MATRIX="[\"$runner\"]"
            else
              MATRIX="${MATRIX%]},\"$runner\"]"
            fi
          }

          if [ "${{ inputs.ubuntu-latest }}" = "true" ]; then append "ubuntu-latest"; fi
          if [ "${{ inputs.macos-latest }}" = "true" ]; then append "macos-latest"; fi
          if [ "${{ inputs.windows-latest }}" = "true" ]; then append "windows-latest"; fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.select-matrix.outputs.matrix) }}
        rust:
          - stable
    runs-on: ${{ matrix.os }}
    if: needs.select-matrix.outputs.matrix != '[]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Rust (Unix)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install Rust (Windows GNU)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Set default Rust toolchain (Windows)
        if: runner.os == 'Windows'
        run: |
          rustup default stable-x86_64-pc-windows-gnu
          rustup override set stable-x86_64-pc-windows-gnu

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install mingw -y
          echo "C:\ProgramData\Chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/kubo-sys/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Populate Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: stable-cache

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Build examples
        run: cargo build --examples --verbose

      - name: Test
        run: cargo test --verbose

      - name: Check docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  ffi-tests:
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    if: needs.select-matrix.outputs.matrix != '[]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/kubo-sys/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build FFI archive
        run: |
          cd go/kubo-sys/ffi
          go build -buildmode=c-archive -o ./tmp/libkubo_ffi.a ./ffi.go

      - name: Build and run C FFI tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cd go/kubo-sys/ffi
          if [ "${{ runner.os }}" = "macOS" ]; then
            cc -o cmd/testffi/testffi cmd/testffi/main.c -I./tmp ./tmp/libkubo_ffi.a -lpthread -ldl -framework Security -framework CoreFoundation -lresolv
          else
            cc -o cmd/testffi/testffi cmd/testffi/main.c -I./tmp ./tmp/libkubo_ffi.a -lpthread -ldl
          fi
          ./cmd/testffi/testffi

      - name: Build and run Rust FFI tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cd go/kubo-sys/ffi
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustc cmd/testrust/main.rs -L ./tmp -lkubo_ffi -o cmd/testrust/testrust \
              -C link-arg="-framework" -C link-arg="Security" \
              -C link-arg="-framework" -C link-arg="CoreFoundation" \
              -lresolv -lpthread -ldl
          else
            rustc cmd/testrust/main.rs -L ./tmp -lkubo_ffi -o cmd/testrust/testrust -lpthread -ldl
          fi
          ./cmd/testrust/testrust

      - name: Build and run Rust tests
        run: cargo test --verbose
