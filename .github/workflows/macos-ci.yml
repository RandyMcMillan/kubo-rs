name: macOS Dispatch CI

on:
  workflow_run:
    workflows: ["Cache Factory"]
    types: [completed]
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  workflow_dispatch:
    inputs:
      macos-latest:
        description: 'Run on macos-latest'
        type: boolean
        default: true
      macos-15:
        description: 'Run on macos-15'
        type: boolean
        default: false
      macos-14:
        description: 'Run on macos-14'
        type: boolean
        default: false
      macos-13:
        description: 'Run on macos-13'
        type: boolean
        default: false
      macos-latest-large:
        description: 'Run on macos-latest-large'
        type: boolean
        default: false
      macos-latest-xlarge:
        description: 'Run on macos-latest-xlarge'
        type: boolean
        default: false
      macos-15-large:
        description: 'Run on macos-15-large'
        type: boolean
        default: false
      macos-15-xlarge:
        description: 'Run on macos-15-xlarge'
        type: boolean
        default: false
      macos-14-large:
        description: 'Run on macos-14-large'
        type: boolean
        default: false
      macos-14-xlarge:
        description: 'Run on macos-14-xlarge'
        type: boolean
        default: false
      macos-13-large:
        description: 'Run on macos-13-large'
        type: boolean
        default: false
      macos-13-xlarge:
        description: 'Run on macos-13-xlarge'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-matrix:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        run: |
          MATRIX="[]"
          append() {
            local runner="$1"
            if [ "$MATRIX" = "[]" ]; then
              MATRIX="[\"$runner\"]"
            else
              MATRIX="${MATRIX%]},\"$runner\"]"
            fi
          }

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            append "macos-latest"
          else
            if [ "${{ inputs.macos-latest }}" = "true" ]; then append "macos-latest"; fi
            if [ "${{ inputs.macos-15 }}" = "true" ]; then append "macos-15"; fi
            if [ "${{ inputs.macos-14 }}" = "true" ]; then append "macos-14"; fi
            if [ "${{ inputs.macos-13 }}" = "true" ]; then append "macos-13"; fi
            if [ "${{ inputs.macos-latest-large }}" = "true" ]; then append "macos-latest-large"; fi
            if [ "${{ inputs.macos-latest-xlarge }}" = "true" ]; then append "macos-latest-xlarge"; fi
            if [ "${{ inputs.macos-15-large }}" = "true" ]; then append "macos-15-large"; fi
            if [ "${{ inputs.macos-15-xlarge }}" = "true" ]; then append "macos-15-xlarge"; fi
            if [ "${{ inputs.macos-14-large }}" = "true" ]; then append "macos-14-large"; fi
            if [ "${{ inputs.macos-14-xlarge }}" = "true" ]; then append "macos-14-xlarge"; fi
            if [ "${{ inputs.macos-13-large }}" = "true" ]; then append "macos-13-large"; fi
            if [ "${{ inputs.macos-13-xlarge }}" = "true" ]; then append "macos-13-xlarge"; fi
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-test:
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.select-matrix.outputs.matrix) }}
        rust:
          - stable
    runs-on: ${{ matrix.os }}
    if: needs.select-matrix.outputs.matrix != '[]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/kubo-sys/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Populate Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: stable-cache

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Build examples
        run: cargo build --examples --verbose

      - name: Test
        run: cargo test --verbose

      - name: Check docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  ffi-tests:
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    if: needs.select-matrix.outputs.matrix != '[]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/kubo-sys/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build FFI archive
        run: |
          cd go/kubo-sys/ffi
          go build -buildmode=c-archive -o ./tmp/libkubo_ffi.a ./ffi.go

      - name: Build and run C FFI tests
        run: |
          cd go/kubo-sys/ffi
          cc -o cmd/testffi/testffi cmd/testffi/main.c -I./tmp ./tmp/libkubo_ffi.a -lpthread -ldl -framework Security -framework CoreFoundation -lresolv
          ./cmd/testffi/testffi

      - name: Build and run Rust FFI tests
        run: |
          cd go/kubo-sys/ffi
          rustc cmd/testrust/main.rs -L ./tmp -lkubo_ffi -o cmd/testrust/testrust \
            -C link-arg="-framework" -C link-arg="Security" \
            -C link-arg="-framework" -C link-arg="CoreFoundation" \
            -lresolv -lpthread -ldl
          ./cmd/testrust/testrust

      - name: Build and run Rust tests
        run: cargo test --verbose

  nostr-tests:
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    if: needs.select-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/kubo-sys/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run nostr plugin tests
        run: |
          cd go/kubo-sys
          go test ./plugin/plugins/nostr/ -v

  git-remote-tests:
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    if: needs.select-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/kubo-sys/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run git-remote protocol tests
        run: |
          cd go/kubo-sys
          go test ./plugin/plugins/git-remote/ -v

      - name: Build git-remote helpers
        run: |
          cd go/kubo-sys
          go build ./cmd/git-remote-ipfs
          go build ./cmd/git-remote-nostr
          go build ./cmd/git-remote-p2p

  nostr-relay-tests:
    needs: select-matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJson(needs.select-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    if: needs.select-matrix.outputs.matrix != '[]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/kubo-sys/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run nostr-relay tests
        run: |
          cd go/kubo-sys
          go test ./plugin/plugins/nostr-relay/ -v

      - name: Build nostr-relay binary
        run: |
          cd go/kubo-sys
          go build ./cmd/nostr-relay
