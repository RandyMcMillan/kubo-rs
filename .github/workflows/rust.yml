name: Rust FFI CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        rust:
          - stable

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules (full depth)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('kubo-sys/go.sum', 'kubo-sys/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Build examples
        run: cargo build --examples --verbose

      - name: Test
        run: cargo test --verbose

      - name: Check docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  check-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules (full depth)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Verify submodule is initialized
        run: |
          test -f kubo-sys/go.mod || { echo "kubo-sys submodule not initialized"; exit 1; }
          test -f kubo-sys/ffi/ffi.go || { echo "kubo-sys/ffi/ffi.go missing"; exit 1; }

  ffi-tests:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules (full depth)
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('kubo-sys/go.sum', 'kubo-sys/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build FFI archive
        run: |
          cd kubo-sys/ffi
          go build -buildmode=c-archive -o ./tmp/libkubo_ffi.a ./ffi.go

      - name: Build and run C FFI tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cd kubo-sys/ffi
          if [ "${{ runner.os }}" = "macOS" ]; then
            cc -o cmd/testffi/testffi cmd/testffi/main.c -I./tmp ./tmp/libkubo_ffi.a -lpthread -ldl -framework Security -framework CoreFoundation -lresolv
          else
            cc -o cmd/testffi/testffi cmd/testffi/main.c -I./tmp ./tmp/libkubo_ffi.a -lpthread -ldl
          fi
          ./cmd/testffi/testffi

      - name: Build and run Rust FFI tests
        run: |
          cargo test --verbose
