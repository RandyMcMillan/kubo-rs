name: Rust FFI CI

on:
  workflow_run:
    workflows: ["Cache Factory"]
    types: [completed]
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        rust:
          - stable

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules (full depth)
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Rust (Unix)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install Rust (Windows GNU)
        if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: Set default Rust toolchain (Windows)
        if: runner.os == 'Windows'
        run: |
          rustup default stable-x86_64-pc-windows-gnu
          rustup override set stable-x86_64-pc-windows-gnu

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Install MinGW (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install mingw -y
          echo "C:\ProgramData\Chocolatey\lib\mingw\tools\install\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify gcc (Windows)
        if: runner.os == 'Windows'
        run: gcc --version

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Populate Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: stable-cache

      - name: Check formatting
        run: cargo fmt -- --check
        continue-on-error: true

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Build examples
        run: cargo build --examples --verbose

      - name: Test
        run: cargo test --verbose

      - name: Check docs
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  cargo-deny:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  check-submodule:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules (full depth)
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Verify submodule is initialized
        run: |
          test -f go/kubo-sys/go.mod || { echo "go/kubo-sys submodule not initialized"; exit 1; }
          test -f go/ffi/go.mod || { echo "go/ffi module missing"; exit 1; }
          test -f go/ffi/main.go || { echo "go/ffi module entrypoint missing"; exit 1; }

  ffi-tests:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules (full depth)
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Build FFI archive
        run: |
          cd go/ffi
          go build -buildmode=c-archive -o ./tmp/libkubo_ffi.a .

      - name: Build and run C FFI tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cd go/ffi
          if [ "${{ runner.os }}" = "macOS" ]; then
            cc -o cmd/testffi/testffi cmd/testffi/main.c -I./tmp ./tmp/libkubo_ffi.a -lpthread -ldl -framework Security -framework CoreFoundation -lresolv
          else
            cc -o cmd/testffi/testffi cmd/testffi/main.c -I./tmp ./tmp/libkubo_ffi.a -lpthread -ldl
          fi
          ./cmd/testffi/testffi

      - name: Build and run Rust FFI tests (Unix)
        if: runner.os != 'Windows'
        run: |
          cd go/ffi
          if [ "${{ runner.os }}" = "macOS" ]; then
            rustc cmd/testrust/main.rs -L ./tmp -lkubo_ffi -o cmd/testrust/testrust \
              -C link-arg="-framework" -C link-arg="Security" \
              -C link-arg="-framework" -C link-arg="CoreFoundation" \
              -lresolv -lpthread -ldl
          else
            rustc cmd/testrust/main.rs -L ./tmp -lkubo_ffi -o cmd/testrust/testrust -lpthread -ldl
          fi
          ./cmd/testrust/testrust

      - name: Build and run Rust tests
        run: |
          cargo test --verbose

  nostr-tests:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules (full depth)
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run nostr plugin tests
        run: |
          cd go/kubo-sys
          go test ./plugin/plugins/nostr/ -v

  git-remote-tests:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules (full depth)
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run git-remote protocol tests
        run: |
          cd go/kubo-sys
          go test ./plugin/plugins/git-remote/ -v

      - name: Build git-remote helpers
        run: |
          cd go/kubo-sys
          go build ./cmd/git-remote-ipfs
          go build ./cmd/git-remote-nostr
          go build ./cmd/git-remote-p2p

  nostr-relay-tests:
    if: github.event_name == 'pull_request' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules (full depth)
        run: |
          git submodule sync
          git submodule update --init

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run nostr-relay tests
        run: |
          cd go/kubo-sys
          go test ./plugin/plugins/nostr-relay/ -v

      - name: Build nostr-relay binary
        run: |
          cd go/kubo-sys
          go build ./cmd/nostr-relay
