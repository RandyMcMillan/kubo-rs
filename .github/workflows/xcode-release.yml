name: Xcode Release

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*-xcode'

permissions:
  contents: write

jobs:
  build-xcode-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-ios-macabi

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Populate Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: stable-cache

      - name: Build XCFramework
        run: cd xcode && make rust

      - name: Zip XCFramework
        run: |
          cd xcode/rustylib
          zip -r rustylib_framework.xcframework.zip rustylib_framework.xcframework

      - name: Install signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build kubo-macos (Designed for iPad)
        env:
          HAS_CERT: ${{ secrets.BUILD_CERTIFICATE_BASE64 != '' }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          cd xcode
          if [ "$HAS_CERT" = "true" ]; then
            SIGN_IDENTITY="Apple Development"
            SIGN_STYLE="Manual"
            PROFILE_SPECIFIER="${PROVISIONING_PROFILE_SPECIFIER}"
          else
            SIGN_IDENTITY=""
            SIGN_STYLE="Automatic"
            PROFILE_SPECIFIER=""
          fi
          xcodebuild \
            -project swiftyapp/kubo-macos.xcodeproj \
            -scheme kubo-macos \
            -configuration Release \
            -derivedDataPath .build/kubo-macos \
            -destination "platform=macOS,variant=Designed for iPad,name=My Mac" \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            CODE_SIGN_STYLE="$SIGN_STYLE" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_SPECIFIER" \
            ENABLE_HARDENED_RUNTIME=NO \
            build

      - name: Ad-hoc sign kubo-macos
        if: ${{ secrets.BUILD_CERTIFICATE_BASE64 == '' }}
        run: |
          cd xcode
          APP_PATH=$(find .build/kubo-macos -name "kubo-macos.app" -type d | head -n1)
          codesign --force --deep --sign - "$APP_PATH"

      - name: Package kubo-macos
        run: |
          cd xcode
          APP_PATH=$(find .build/kubo-macos -name "kubo-macos.app" -type d | head -n1)
          echo "Found app at: $APP_PATH"
          (
            cd "$(dirname "$APP_PATH")"
            zip -r -y "$GITHUB_WORKSPACE/xcode/kubo-macos.zip" "$(basename "$APP_PATH")"
          )

      - name: Build swiftyapp (iOS Simulator)
        run: |
          cd xcode
          xcodebuild \
            -project swiftyapp/swiftyapp.xcodeproj \
            -scheme swiftyapp \
            -configuration Release \
            -derivedDataPath .build/swiftyapp \
            -destination "generic/platform=iOS Simulator" \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package swiftyapp
        run: |
          cd xcode
          APP_PATH=$(find .build/swiftyapp -name "swiftyapp.app" -type d | head -n1)
          echo "Found app at: $APP_PATH"
          (
            cd "$(dirname "$APP_PATH")"
            zip -r -y "$GITHUB_WORKSPACE/xcode/swiftyapp.zip" "$(basename "$APP_PATH")"
          )

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xcode/rustylib/rustylib_framework.xcframework.zip
            xcode/kubo-macos.zip
            xcode/swiftyapp.zip
