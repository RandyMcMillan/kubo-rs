name: Xcode Release

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*-xcode'

permissions:
  contents: write

jobs:
  build-xcode-release:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-ios-macabi

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go/kubo-sys/go.sum', 'go/ffi/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Populate Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: stable-cache

      - name: Build XCFramework
        run: cd xcode && make rust

      - name: Zip XCFramework
        run: |
          cd xcode/rustylib
          zip -r rustylib_framework.xcframework.zip rustylib_framework.xcframework

      - name: Build kubo-macos (Mac Catalyst)
        run: |
          cd xcode
          xcodebuild \
            -project swiftyapp/kubo-macos.xcodeproj \
            -scheme kubo-macos \
            -configuration Release \
            -derivedDataPath .build/kubo-macos \
            -destination "generic/platform=macOS,variant=Mac Catalyst" \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package kubo-macos
        run: |
          cd xcode
          APP_PATH=$(find .build/kubo-macos -name "kubo-macos.app" -type d | head -n1)
          echo "Found app at: $APP_PATH"
          TMP_DIR=$(mktemp -d)
          cp -R "$APP_PATH" "$TMP_DIR/"
          cd "$TMP_DIR"
          zip -r "$GITHUB_WORKSPACE/xcode/kubo-macos.zip" "kubo-macos.app"

      - name: Build swiftyapp (iOS Simulator)
        run: |
          cd xcode
          xcodebuild \
            -project swiftyapp/swiftyapp.xcodeproj \
            -scheme swiftyapp \
            -configuration Release \
            -derivedDataPath .build/swiftyapp \
            -destination "generic/platform=iOS Simulator" \
            ARCHS="$(uname -m)" \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package swiftyapp
        run: |
          cd xcode
          APP_PATH=$(find .build/swiftyapp -name "swiftyapp.app" -type d | head -n1)
          echo "Found app at: $APP_PATH"
          TMP_DIR=$(mktemp -d)
          cp -R "$APP_PATH" "$TMP_DIR/"
          cd "$TMP_DIR"
          zip -r "$GITHUB_WORKSPACE/xcode/swiftyapp.zip" "swiftyapp.app"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xcode/rustylib/rustylib_framework.xcframework.zip
            xcode/kubo-macos.zip
            xcode/swiftyapp.zip
