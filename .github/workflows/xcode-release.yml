name: Xcode Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (tag, branch, or SHA)'
        type: string
        default: 'main'
      configuration:
        description: 'Build configuration'
        type: choice
        options:
          - Release
          - Debug
        default: 'Release'
      upload-artifact:
        description: 'Upload build artifacts'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Populate Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: stable-cache

      - name: Install Apple certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build Rust library and XCFramework
        run: cd xcode && make rust

      - name: Build iOS app (generic)
        run: |
          cd xcode
          xcodebuild \
            -project swiftyapp/kubo-macos.xcodeproj \
            -scheme kubo-macos \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -derivedDataPath .build/xcode \
            -destination generic/platform=iOS \
            ARCHS=arm64 \
            build

      - name: Build iOS Simulator
        run: |
          cd xcode
          xcodebuild \
            -project swiftyapp/kubo-macos.xcodeproj \
            -scheme kubo-macos \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -derivedDataPath .build/xcode \
            -destination 'platform=iOS Simulator,name=Any iOS Simulator Device' \
            ARCHS='arm64 x86_64' \
            build

      - name: Upload iOS artifact
        if: github.event.inputs.upload-artifact != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kubo-macos-ios
          path: xcode/.build/xcode/${{ github.event.inputs.configuration || 'Release' }}-iphoneos/kubo-macos.app
          retention-days: 7

  build-macos:
    name: Build macOS (Designed for iPad)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Init submodules
        run: |
          git submodule sync
          git submodule update --init --recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-macabi

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Populate Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: stable-cache

      - name: Install Apple certificate
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Build Rust library and XCFramework
        run: cd xcode && make rust

      - name: Build macOS (Designed for iPad)
        run: |
          cd xcode
          xcodebuild \
            -project swiftyapp/kubo-macos.xcodeproj \
            -scheme kubo-macos \
            -configuration ${{ github.event.inputs.configuration || 'Release' }} \
            -derivedDataPath .build/xcode \
            -destination 'platform=macOS,variant=Designed for iPad,name=My Mac' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build

      - name: Ad-hoc sign app
        run: |
          APP_PATH="xcode/.build/xcode/${{ github.event.inputs.configuration || 'Release' }}-iphoneos/kubo-macos.app"
          if [ -d "$APP_PATH" ]; then
            codesign --force --deep --sign - "$APP_PATH"
          fi

      - name: Upload macOS artifact
        if: github.event.inputs.upload-artifact != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: kubo-macos-designed-for-ipad
          path: xcode/.build/xcode/${{ github.event.inputs.configuration || 'Release' }}-iphoneos/kubo-macos.app
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: [build-ios, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: kubo-macos-ios
          path: artifacts/ios

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: kubo-macos-designed-for-ipad
          path: artifacts/macos

      - name: Package artifacts
        run: |
          cd artifacts/ios
          zip -r ../../kubo-macos-ios.zip .
          cd ../macos
          zip -r ../../kubo-macos-designed-for-ipad.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kubo-macos-ios.zip
            kubo-macos-designed-for-ipad.zip
          generate_release_notes: true
