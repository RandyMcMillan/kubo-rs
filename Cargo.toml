[workspace]
members = [".", "xcode/rustylib", "examples/wasm-dashboard", "examples/website", "examples/shared", "examples/wasm-hybrid", "examples/wasm-p2p", "examples/wasm-hybrid-wasi"]
resolver = "3"

[workspace.package]
version = "0.8.1"
authors = ["Randy McMillan <randy.lee.mcmillan@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/RandyMcMillan/kubo-rs"
rust-version = "1.85"

[package]
name = "kubo-rs"
version.workspace = true
edition = "2024"
build = "build.rs"
links = "kubo_ffi"
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust bindings for Kubo (IPFS in Go) via CGO/FFI"
keywords = ["ipfs", "kubo", "p2p", "libp2p", "ffi"]
categories = ["filesystem", "network-programming"]
rust-version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
criterion = "0.5"
ratatui = "0.30"
crossterm = "0.29"
rand = "0.8"
nostr = "0.45"
nostr-sdk = "0.45"
git2 = "0.21"
libp2p = "0.56"
ureq = "3"

[[bench]]
name = "add_bytes"
harness = false

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.docs.rs]
# docs.rs needs the kubo-sys submodule and Go toolchain to build.
# The default build environment has git and Go available, but we
# must ensure submodules are checked out.
features = []
no-default-features = true
