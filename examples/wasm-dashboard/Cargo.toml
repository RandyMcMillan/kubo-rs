[package]
name = "wasm-dashboard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
ratzilla = "0.3"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
]
