<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/firacode/6.2.0/fira_code.min.css"
    />
    <link data-trunk rel="rust"/>
    <title>Kubo IPFS Dashboard</title>
    <style>
      :root {
        --solarized-base03: #002b36;
        --solarized-base02: #073642;
        --solarized-base01: #586e75;
        --solarized-base00: #657b83;
        --solarized-base0: #839496;
        --solarized-base1: #93a1a1;
        --solarized-base2: #eee8d5;
        --solarized-base3: #fdf6e3;
        --solarized-yellow: #b58900;
        --solarized-orange: #cb4b16;
        --solarized-red: #dc322f;
        --solarized-magenta: #d33682;
        --solarized-violet: #6c71c4;
        --solarized-blue: #268bd2;
        --solarized-cyan: #2aa198;
        --solarized-green: #859900;
      }
      body {
        margin: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        align-content: center;
        background-color: var(--solarized-base03);
        color: var(--solarized-base0);
      }
      body.light {
        background-color: var(--solarized-base3);
        color: var(--solarized-base00);
      }
      pre {
        font-family: "Fira Code", monospace;
        font-size: 14px;
        margin: 0px;
      }
    </style>
  </head>
  <body>
    <script type="module">
      window.addEventListener("TrunkApplicationStarted", (_) => {
        console.log("Kubo dashboard initialized");
      });
    </script>
  </body>
</html>
