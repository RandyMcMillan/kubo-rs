[package]
name = "wasm-hybrid-wasi"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
ratzilla = "0.3"
ratatui = { version = "0.30", default-features = false }
critical-section = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
nostr = { version = "0.45", features = ["std", "os-rng"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Event",
  "EventTarget",
]

[package.metadata.wasi]
# wasm32-wasip1 allows C library compilation via WASI,
# but requires wasi-sdk for cc-rs to compile secp256k1-sys.
