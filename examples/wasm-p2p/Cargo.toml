[package]
name = "wasm-p2p"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
ratzilla = "0.3"
ratatui = { version = "0.30", default-features = false }
libp2p-identity = { version = "0.2", features = ["ed25519", "rand"] }
libp2p-webrtc-websys = "0.4"
libp2p-websocket-websys = "0.5"
libp2p-core = "0.43"
libp2p-swarm = { version = "0.47", features = ["macros", "wasm-bindgen"] }
libp2p-ping = "0.47"
libp2p-noise = "0.46"
libp2p-yamux = "0.47"
getrandom = { version = "0.3", features = ["wasm_js"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
futures = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "Event",
  "EventTarget",
  "KeyboardEvent",
  "MessageEvent",
  "WebSocket",
]
